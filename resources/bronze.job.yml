resources:
  jobs:
    pp_industrial_broze:
      name: pp_industrial_broze
      schedule:
        quartz_cron_expression: 12 0 8 * * ?
        timezone_id: America/Sao_Paulo
        pause_status: UNPAUSED
      tasks:
        - task_key: pp_industrial_bronze
          spark_python_task:
            python_file: ${workspace.file_path}/notebooks/bronze/create_bronze.py
            source: WORKSPACE
          environment_key: Default
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
      performance_target: PERFORMANCE_OPTIMIZED
