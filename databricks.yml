bundle:
  name: databricks-pipeline-template

include:
  - resources/*.job.yml

variables:
  databricks_host:
    description: Databricks workspace URL

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: ${var.databricks_host}

  prod:
    mode: production
    workspace:
      host: ${var.databricks_host}
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}