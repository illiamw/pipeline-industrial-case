
name: Data Pipeline CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:

  # =====================================================
  # 1. CODE QUALITY AND UNIT TESTS
  # =====================================================
  quality-and-tests:
    name: Code Quality and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Python setup
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Code quality
      - name: Run Ruff
        run: ruff check src tests

      # JSON validation
      - name: Validate Databricks Job JSON
        shell: bash
        run: |
          shopt -s nullglob
          files=(jobs/*.json)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No Job JSON files found."
            exit 1
          fi

          for file in "${files[@]}"; do
            echo "Validating $file"
            python -m json.tool "$file" > /dev/null
          done

      # Unit tests and coverage
      - name: Run unit tests
        run: |
          pytest tests/ \
            --cov=src/data_pipeline \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=80

      # Coverage artifact
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore


  # =====================================================
  # 2. DEPLOY DEVELOPMENT
  # =====================================================
  deploy-dev:
    name: Deploy Development
    needs: quality-and-tests

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop'

    runs-on: ubuntu-latest
    environment: dev

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Databricks CLI
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      # Credentials validation
      - name: Check Databricks credentials
        shell: bash
        run: |
          test -n "$DATABRICKS_HOST" || {
            echo "DATABRICKS_HOST is missing"
            exit 1
          }

          test -n "$DATABRICKS_TOKEN" || {
            echo "DATABRICKS_TOKEN is missing"
            exit 1
          }

      # Authentication test
      - name: Test Databricks Authentication
        run: databricks current-user me

      # Bundle validation
      - name: Validate Databricks Bundle
        run: databricks bundle validate --target dev

      # Deploy
      - name: Deploy Databricks Bundle
        run: databricks bundle deploy --target dev


  # =====================================================
  # 3. DEPLOY PRODUCTION
  # =====================================================
  deploy-prod:
    name: Deploy Production
    needs: quality-and-tests

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    environment: prod

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Databricks CLI
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      # Credentials validation
      - name: Check Databricks credentials
        shell: bash
        run: |
          test -n "$DATABRICKS_HOST" || {
            echo "DATABRICKS_HOST is missing"
            exit 1
          }

          test -n "$DATABRICKS_TOKEN" || {
            echo "DATABRICKS_TOKEN is missing"
            exit 1
          }

      # Authentication test
      - name: Test Databricks Authentication
        run: databricks current-user me

      # Bundle validation
      - name: Validate Databricks Bundle
        run: databricks bundle validate --target prod

      # Deploy
      - name: Deploy Databricks Bundle
        run: databricks bundle deploy --target prod


        