
name: Data Pipeline CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  quality-and-tests:
    name: Code Quality and Unit Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Obter o código do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Instalar dependências
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # 4. Verificar qualidade do código
      - name: Run Ruff
        run: |
          ruff check src tests

      # 5. Validar arquivos JSON dos Jobs
      - name: Validate Databricks Job JSON
        run: |
          for file in jobs/*.json; do
            echo "Validating $file"
            python -m json.tool "$file" > /dev/null
          done

      # 6. Executar testes e verificar cobertura
      - name: Run unit tests
        run: |
          pytest tests/ \
            --cov=src/data_pipeline \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=80

      # 7. Disponibilizar relatório de cobertura
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

  deploy-dev:
    name: Deploy Development
    needs: quality-and-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: dev

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: |
          databricks bundle validate \
            --target dev \
            --var="databricks_host=${DATABRICKS_HOST}"

      - name: Deploy to Databricks
        run: |
          databricks bundle deploy \
            --target dev \
            --var="databricks_host=${DATABRICKS_HOST}"

  deploy-prod:
    name: Deploy Production
    needs: quality-and-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: |
          databricks bundle validate \
            --target prod \
            --var="databricks_host=${DATABRICKS_HOST}"

      - name: Deploy to Databricks
        run: |
          databricks bundle deploy \
            --target prod \
            --var="databricks_host=${DATABRICKS_HOST}"
